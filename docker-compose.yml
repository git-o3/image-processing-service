services:
  api-server:
    build:
      context: ./api-server
      dockerfile: Dockerfile
    container_name: api_server
    restart: always
    env_file:
      - ./api-server/.env
    ports:
      - "${PORT}:${PORT}"
    networks:
      - app-network
    depends_on:
      mongo_db:
        condition: service_healthy
      rabbit_mq:
        condition: service_healthy

  mongo_db:
    image: mongo:6.0
    container_name: mongo_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  rabbit_mq:
    image: rabbitmq:3-management-alpine
    container_name: rabbit_mq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data: